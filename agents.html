<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bazooka for agents</title>
<meta name="description" content="How an AI agent connects to Bazooka, Piyush's founder tracker, and the bazooka-v3 format it saves in.">
<link rel="alternate" type="text/markdown" href="/AGENTS.md" title="Bazooka for AI agents: read this first">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Sans:wght@400..700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="/app/tokens.css">
<style>
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: var(--t-xl); } h2 { font-size: var(--t-lg); margin: 32px 0 10px; }
  p, li { color: var(--ink-2); line-height: 1.6; } strong { color: var(--ink); }
  ol, ul { padding-left: 22px; }
  code, pre { font: 500 .85rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  code { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 6px; color: var(--ink); overflow-wrap: anywhere; }
  pre { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; overflow-x: auto; white-space: pre-wrap; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--rule-2); vertical-align: top; }
  th { color: var(--ink-2); border-top: 0; }
  td:first-child { white-space: nowrap; color: var(--ink); font-weight: 600; }
  h3 { font-size: var(--t-md); margin: 20px 0 8px; }
  .lead { color: var(--ink-2); margin-bottom: 8px; }
  .tw { overflow-x: auto; }
  #doc h1 { margin-top: 12px; }
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in"><a class="logo" href="/"><b>Bazooka</b><span class="ver">2.0</span></a></div></header>
<main>
  <p class="lead">This is the guide AI agents read at <a href="/AGENTS.md"><code>/AGENTS.md</code></a>. To connect an agent, an admin creates its token in Admin → Team → Agents and copies the message shown there into the agent.</p>
  <article id="doc"><p class="muted">Loading the guide…</p></article>
</main>
<script>
// A small Markdown renderer for the guide (headings, lists, tables, code, bold, inline code, links).
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((\/[^)\s]*|https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
function render(md) {
  const out = []; const lines = md.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith('```')) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]); i++; out.push(`<pre>${esc(buf.join('\n'))}</pre>`); continue; }
    const h = l.match(/^(#{1,3}) (.*)/); if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (l.startsWith('|')) { const rows = []; while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]);
      const cells = (r) => r.slice(1, -1).split(' | ').map((c) => c.trim());
      out.push(`<div class="tw"><table><thead><tr>${cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
    if (/^(- |\d+\. )/.test(l)) { const ol = /^\d/.test(l); const items = []; while (i < lines.length && /^(- |\d+\. )/.test(lines[i])) items.push(lines[i++].replace(/^(- |\d+\. )/, ''));
      out.push(`<${ol ? 'ol' : 'ul'}>${items.map((x) => `<li>${inline(x)}</li>`).join('')}</${ol ? 'ol' : 'ul'}>`); continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#|- |\d+\. |\||```)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join(' '))}</p>`);
  }
  return out.join('\n');
}
fetch('/AGENTS.md').then((r) => (r.ok ? r.text() : Promise.reject(new Error(r.status)))).then((md) => { document.getElementById('doc').innerHTML = render(md); })
  .catch(() => { document.getElementById('doc').innerHTML = '<p class="notice bad">Could not load the guide. Open <a href="/AGENTS.md">/AGENTS.md</a> directly.</p>'; });
</script>
</body>
</html>
