<!doctype html>
<!-- AI agent? Read /AGENTS.md on this site first: what Bazooka is, how to connect with your token, and the exact format to save in. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="alternate" type="text/markdown" href="/AGENTS.md" title="Bazooka for AI agents: read this first">
<title>Sign in to Bazooka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Sans:wght@400..700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="/app/tokens.css">
<style>
  main { min-height: calc(100dvh - 57px); display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 400px; padding: 28px 24px 24px; }
  h1 { font-size: var(--t-lg); margin-bottom: 4px; }
  form { display: grid; gap: 14px; margin-top: 18px; }
  .btn-primary { width: 100%; margin-top: 4px; }
  #msg:empty { display: none; }
</style>
</head>
<body>
<p hidden>AI agent? Read <a href="/AGENTS.md">/AGENTS.md</a> first. It explains what Bazooka is, how to connect with your token, and the bazooka-v3 format to save in.</p>
<header class="appbar"><div class="appbar-in"><a class="logo" href="/" aria-label="Bazooka 2.0"><b>Bazooka</b><span class="ver">2.0</span></a></div></header>
<main>
  <section class="card sheet" aria-labelledby="title">
    <h1 id="title">Sign in</h1>
    <p class="muted small">For Piyush's team. Ask the admin if you need an account.</p>
    <form id="signin" novalidate>
      <div class="field"><label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="username" inputmode="email" required></div>
      <div class="field"><label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p id="msg" class="notice bad" role="alert" style="margin-top:14px"></p>
  </section>
</main>
<script type="module">
import { auth } from '/app/data.js';
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const raw = params.get('back');
const back = raw && raw.startsWith('/') && !raw.startsWith('//') && !raw.startsWith('/login') ? raw : '/';
const msg = (t) => { $('#msg').textContent = t || ''; };

async function go() {
  try {
    const me = await auth.me();
    if (me && !me.notMember) return location.replace(back);
    if (me?.notMember) { await auth.signOut(); msg(`${me.email || 'This account'} isn't on the Bazooka team. Ask the admin to add you.`); }
  } catch (e) { msg(e.message); }
}

$('#signin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim(), pw = $('#password').value;
  if (!email || !pw) { msg('Enter your email and password.'); return; }
  const btn = e.submitter || $('#signin button'); btn.disabled = true; btn.textContent = 'Signing in…'; msg('');
  try { await auth.signIn(email, pw); await go(); }
  catch (err) { msg(err.message); }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});
go();
</script>
</body>
</html>
